# Nginx config — Memory Repository em Nutka.com.br
# Adicione este bloco dentro do seu server { } do nutka.com.br
# Depois rode: nginx -t && nginx -s reload

    # Memory Repository — /painel-zap/memories
    location /painel-zap/memories {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API de memórias
    location /api/memories {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Arquivos estáticos do Next.js (memory app)
    location /_next/static {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_bypass $http_upgrade;
    }
